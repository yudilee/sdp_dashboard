version: '3.8'

# docker-compose untuk cutover sdp_dashboard: SQLite -> MySQL
# Dasar: docker-compose.yml di main (bbcf620) + service mysql + env DB_* di app & scheduler.
# Password TIDAK ditulis di file ini: diisi di Portainer > stack sdp_dashboard > Environment variables
#   SDP_DB_PASSWORD       (password user sdp)
#   SDP_DB_ROOT_PASSWORD  (password root MySQL)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdp_dashboard
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - sdp_storage:/var/www/html/storage/app
    environment:
      - APP_NAME=SDP_Dashboard
      - APP_ENV=production
      - APP_DEBUG=true
      - APP_URL=https://sdp-dashboard.hartonomotor-group.com
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=sdp
      - DB_USERNAME=sdp
      - DB_PASSWORD=${SDP_DB_PASSWORD}
      - SESSION_DRIVER=file
      - SESSION_DRIVER=file
      - CACHE_STORE=file
      - TZ=Asia/Jakarta
    depends_on:
      - mysql

  # Scheduler for automatic Odoo sync
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdp_scheduler
    restart: unless-stopped
    entrypoint: []
    command: >
      sh -c "while true; do 
        echo '[Scheduler] Running at '$(date);
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    volumes:
      - sdp_storage:/var/www/html/storage/app
    environment:
      - APP_NAME=SDP_Dashboard
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://sdp-dashboard.hartonomotor-group.com
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=sdp
      - DB_USERNAME=sdp
      - DB_PASSWORD=${SDP_DB_PASSWORD}
      - SESSION_DRIVER=file
      - SESSION_DRIVER=file
      - CACHE_STORE=file
      - TZ=Asia/Jakarta
    depends_on:
      - app
      - mysql

  mysql:
    image: mysql:8.0
    container_name: sdp_mysql_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=sdp
      - MYSQL_USER=sdp
      - MYSQL_PASSWORD=${SDP_DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${SDP_DB_ROOT_PASSWORD}
      - TZ=Asia/Jakarta
    volumes:
      - sdp_mysql_data:/var/lib/mysql
    command:
      - --innodb-buffer-pool-size=512M
      - --innodb-flush-log-at-trx-commit=2
      - --skip-log-bin

volumes:
  sdp_storage:
  sdp_mysql_data:
    name: sdp_dashboard_sdp_db_data
